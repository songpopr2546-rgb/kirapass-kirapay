<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KiraPass Receipt</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="centered-page">
    <main class="checkout-card wide">
      <a class="brand receipt-brand" href="/" aria-label="KiraPass home">
        <img
          class="brand-mark"
          src="https://res.cloudinary.com/dgvnuwspr/image/upload/v1774881995/earn-sponsor/dlci8owybwakqwbtswv2.png"
          alt="KIRAPAY"
        />
        <span class="brand-text">
          <strong>KiraPass</strong>
          <span>Payment receipt</span>
        </span>
      </a>
      <div id="receipt"></div>
      <a class="primary-link" href="/">Open merchant console</a>
    </main>
    <script src="/success.js" defer></script>
  </body>
</html>
