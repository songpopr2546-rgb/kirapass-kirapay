<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KIRAPAY Demo Checkout</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="centered-page">
    <main class="checkout-card">
      <img
        class="checkout-logo"
        src="https://res.cloudinary.com/dgvnuwspr/image/upload/v1774881995/earn-sponsor/dlci8owybwakqwbtswv2.png"
        alt="KIRAPAY"
      />
      <p class="overline">Demo mode</p>
      <h1>Hosted checkout preview</h1>
      <div class="receipt-lines" id="mockReceipt"></div>
      <button class="primary-action" id="completeDemo" type="button">
        Complete demo payment
      </button>
      <a class="plain-link" href="/">Back to KiraPass</a>
    </main>
    <script src="/mock-checkout.js" defer></script>
  </body>
</html>
